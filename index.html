<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Laura Martínez Clinic — medicina estética avanzada y estética en Granollers.">
<title>Laura Martínez Clinic</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap");
:root{--ivory:#f5f0e8;--paper:#fbf9f5;--ink:#252321;--muted:#68615a;--gold:#a88949;--gold-soft:#c2a66a;--line:rgba(37,35,33,.16);--max:1280px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:Montserrat,Arial,sans-serif;font-weight:300;line-height:1.7}img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font:inherit}.container{width:min(calc(100% - 64px),var(--max));margin:auto}.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:.70rem;letter-spacing:.30em;text-transform:uppercase;color:var(--muted)}
.site-header{position:absolute;z-index:20;top:0;left:0;right:0;color:#fff;padding:25px 34px 0}.nav{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:24px}.nav-side{display:flex;align-items:center;gap:30px;padding-top:13px}.nav-right{grid-column:3;justify-content:flex-end;padding-right:0}.nav a{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}.nav a:hover{color:var(--gold-soft)}.logo{grid-column:2;position:relative;display:block;width:min(225px,22vw);z-index:2}.nav-right .menu-button{display:none}.menu-button{width:34px;height:34px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;margin-top:3px}.menu-button span,.menu-button span:before,.menu-button span:after{content:"";display:block;width:23px;height:1px;background:#fff;position:relative}.menu-button span:before{position:absolute;top:-7px}.menu-button span:after{position:absolute;top:7px}.mobile-menu{display:none}.mobile-panel{display:none}
.hero{min-height:100svh;position:relative;overflow:hidden;color:#fff;background:#cfc2b4}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,15,12,.04),transparent 55%,rgba(18,15,12,.12));pointer-events:none}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}.hero-content{position:relative;z-index:3;min-height:100svh;display:flex;align-items:center;padding:135px 0 70px}.hero-copy{width:min(560px,48vw)}.hero .eyebrow{color:rgba(255,255,255,.82);margin-bottom:24px}.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(3.5rem,6.1vw,6.6rem);line-height:.82;font-weight:400;letter-spacing:-.025em;margin:0 0 36px}.hero h1 em{display:block;color:#c7aa6b;font-weight:400}.hero-lead{font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;margin:0 0 26px}.hero-phrase{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(1.45rem,2.1vw,2.1rem);line-height:1.12;max-width:440px;margin:0 0 38px}.gold-link{display:inline-flex;align-items:center;gap:22px;padding-bottom:9px;border-bottom:1px solid #c7aa6b;font-size:.67rem;letter-spacing:.23em;text-transform:uppercase;color:#fff}.gold-link:after{content:"→";font-size:1.15rem;color:#c7aa6b}
section{scroll-margin-top:30px}.intro{padding:150px 0;background:var(--paper)}.intro-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(420px,1fr);gap:110px;align-items:center}.intro h2,.editorial h2,.center-section h2,.skin h2,.cta h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,4vw,4.35rem);line-height:.92;margin:0}.intro-copy{max-width:650px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.18rem;line-height:1.48}.intro-copy p{margin:0 0 28px}.signature{margin-top:50px;color:var(--gold);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;font-style:italic}.intro-media{width:100%;aspect-ratio:4/5;overflow:hidden}.intro-media img{width:100%;height:100%;display:block;object-fit:cover;object-position:center center}
.treatments{padding:0 0 150px;background:var(--paper)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:48px}.section-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(2.8rem,4.7vw,5rem);line-height:.9;margin:0}.section-head p{max-width:380px;margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#eee8df;min-height:420px;position:relative;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}.card:hover img{transform:scale(1.035)}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}.card-content{position:absolute;z-index:2;left:25px;right:25px;bottom:25px;color:#fff}.card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.1rem;font-weight:400;margin:0 0 6px}.card p{margin:0 0 14px;font-size:.72rem;letter-spacing:.05em;opacity:.9}.card a{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.65);padding-bottom:5px}
.editorial{background:var(--ivory);padding:150px 0}.editorial-grid{display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:center}.editorial-image{aspect-ratio:4/5;overflow:hidden}.editorial-image img{width:100%;height:100%;object-fit:cover}.editorial-copy{max-width:570px}.editorial-copy .eyebrow{margin-bottom:24px}.editorial-copy p{color:var(--muted);max-width:500px}.method{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:55px}.method div{border-top:1px solid var(--line);padding-top:16px}.method strong{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}.method span{color:var(--muted);font-size:.86rem}
.laura{padding:150px 0;background:#fff}.laura-grid{display:grid;grid-template-columns:1fr .9fr;gap:100px;align-items:center}.laura-image{aspect-ratio:4/5;overflow:hidden}.laura-image img{width:100%;height:100%;object-fit:cover}.laura-copy h2{margin-bottom:30px}.laura-copy p{color:var(--muted);max-width:590px}.quote{border-left:1px solid var(--gold);padding-left:24px;margin-top:38px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.55rem;line-height:1.2;font-style:italic}
.center-section{padding:150px 0;background:var(--ivory)}.center-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:90px;align-items:center}.center-image{aspect-ratio:16/11;overflow:hidden}.center-image img{width:100%;height:100%;object-fit:cover}.center-copy p{color:var(--muted);max-width:540px}.center-details{margin-top:35px;border-top:1px solid var(--line)}.detail{display:flex;justify-content:space-between;gap:30px;padding:16px 0;border-bottom:1px solid var(--line);font-size:.78rem}.detail span:first-child{letter-spacing:.16em;text-transform:uppercase;font-size:.62rem}
.skin{padding:150px 0;background:var(--paper)}.skin-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:100px}.skin-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 50px}.skin-list a{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.55rem}.skin-list a:after{content:"↗";color:var(--gold);font-family:Arial,sans-serif;font-size:.85rem}
.tech{padding:0 0 150px}.tech-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tech-card{padding:45px;min-height:300px;background:#e9e1d6}.tech-card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.1rem;font-weight:400;margin:40px 0 12px}.tech-card p{color:var(--muted);font-size:.86rem}
.cta{background:#26231f;color:#fff;padding:120px 0;text-align:center}.cta h2{max-width:800px;margin:0 auto 28px}.cta p{max-width:560px;margin:0 auto 35px;color:rgba(255,255,255,.72)}
.contact{padding:120px 0;background:#fff}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:100px}.contact h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:4rem;line-height:.95;font-weight:400;margin:0 0 25px}.contact p{color:var(--muted)}.form{display:grid;gap:14px}.form input,.form select,.form textarea{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 2px;background:transparent;outline:0;font:300 .78rem Montserrat,Arial,sans-serif}.form textarea{min-height:100px;resize:vertical}.submit{margin-top:15px;width:max-content;border:1px solid var(--gold);background:transparent;color:var(--ink);padding:14px 23px;cursor:pointer;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase}
footer{padding:42px 0;background:#1d1b18;color:rgba(255,255,255,.7)}.footer-grid{display:flex;justify-content:space-between;gap:40px;align-items:center}.footer-brand{color:#c7aa6b;font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem}.footer-links{display:flex;gap:25px;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase}
html.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}html.js .reveal.visible{opacity:1;transform:none}.reveal{opacity:1;transform:none}
@media(max-width:1000px){.site-header{padding-inline:22px}.nav-side{gap:11px}.nav a{font-size:.56rem;letter-spacing:.15em}.logo{width:min(205px,24vw)}.cards{grid-template-columns:repeat(2,1fr)}.intro-grid,.editorial-grid,.laura-grid,.center-grid,.skin-grid,.contact-grid{gap:55px}}
@media(max-width:760px){.container{width:min(calc(100% - 36px),var(--max))}.site-header{padding:18px 18px 0}.nav{grid-template-columns:1fr auto;min-height:42px}.nav-side{display:none}.logo{grid-column:auto;display:block;position:absolute;left:50%;top:0;transform:translateX(-50%);width:170px;z-index:2}.nav:after{display:none}.mobile-menu{display:grid;grid-column:2;justify-self:end;z-index:4}.mobile-panel{position:absolute;top:68px;left:18px;right:18px;background:rgba(31,28,24,.96);padding:22px;display:none;flex-direction:column;gap:17px}.mobile-panel.open{display:flex}.mobile-panel a{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#fff}.hero{min-height:900px}.hero-image{object-position:63% center}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,12,10,.14),rgba(15,12,10,.12) 45%,rgba(15,12,10,.46));z-index:1}.hero-content{min-height:900px;align-items:flex-end;padding:150px 0 72px}.hero-copy{width:100%;max-width:520px}.hero h1{font-size:clamp(3.5rem,17vw,5.2rem);margin-bottom:28px}.hero .eyebrow{margin-bottom:18px}.hero-lead{font-size:.61rem;letter-spacing:.18em}.intro,.editorial,.laura,.center-section,.skin,.contact{padding:95px 0}.intro-grid,.editorial-grid,.laura-grid,.center-grid,.skin-grid,.contact-grid{grid-template-columns:1fr}.intro-grid{gap:55px}.intro h2{font-size:3rem}.intro-copy{font-size:1.18rem}.intro-media{aspect-ratio:4/5;order:2}.cards,.tech-grid{grid-template-columns:1fr}.card{min-height:440px}.section-head{display:block}.section-head p{margin-top:20px}.method{grid-template-columns:1fr;gap:20px}.skin-list{grid-template-columns:1fr}.contact h2{font-size:3.5rem}.footer-grid{display:block}.footer-links{margin-top:18px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.card img{transition:none}}
</style>
</head>
